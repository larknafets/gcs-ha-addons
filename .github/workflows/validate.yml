name: Validate Add-ons

on:
  push:
    paths:
      - "**/config.*"
      - "repository.yaml"
  pull_request:
    paths:
      - "**/config.*"
      - "repository.yaml"

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changedAddons: ${{ steps.detect.outputs.changed_addons }}
      repositoryYamlChanged: ${{ steps.detect.outputs.repository_yaml_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed add-ons and repository.yaml
        id: detect
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # First push to a new branch / repo: github.event.before is all zeroes.
          # Diff against the empty tree instead so every file counts as changed.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git hash-object -t tree /dev/null)
          fi

          head="${{ github.sha }}"

          changed_addons=$(.github/scripts/detect-changed-addons.sh "$base" "$head")
          echo "changed_addons=${changed_addons}" >> "$GITHUB_OUTPUT"

          if git diff --name-only "$base" "$head" | grep -qx repository.yaml; then
            echo "repository_yaml_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "repository_yaml_changed=false" >> "$GITHUB_OUTPUT"
          fi

  lint-addons:
    name: Lint ${{ matrix.addon }}
    needs: detect-changes
    if: needs.detect-changes.outputs.changedAddons != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.detect-changes.outputs.changedAddons) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add-on schema lint
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"
          community: false

      - name: Extract image and version from config.yaml
        id: info
        run: |
          set -euo pipefail
          image=$(ruby -ryaml -e "puts YAML.load_file('${{ matrix.addon }}/config.yaml').fetch('image')")
          version=$(ruby -ryaml -e "puts YAML.load_file('${{ matrix.addon }}/config.yaml').fetch('version')")
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify referenced image manifest exists
        run: docker manifest inspect "${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}" > /dev/null

  lint-repository-yaml:
    name: Lint repository.yaml
    needs: detect-changes
    if: needs.detect-changes.outputs.repositoryYamlChanged == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository.yaml is well-formed YAML
        run: ruby -ryaml -e "YAML.load_file('repository.yaml')"
